[General]
## Background image path
## Leave empty for a solid color background
Background="background.jpg"

## Background blur radius (0 to disable)
BackgroundBlur=20

## Theme color - matches Material Palenight
ThemeColor="#82aaff"

## Accent color for highlights
AccentColor="#c792ea"

## Background colors
BgBase="#292d3e"
BgSurface="#1e2030"

## Text colors
FgPrimary="#d9d7ce"
FgSecondary="#7d83a1"

## Font settings
Font="MapleMono NF"
FontSize=11
TitleFontSize=32

## Show user avatars (true/false)
EnableAvatars=true

## Avatar image path (can use ~/.face.icon or custom path)
AvatarPath="/var/lib/AccountsService/icons/"

## Show hostname (true/false)
ShowHostname=true

## Show session select button (true/false)
ShowSessionButton=true

## Show power buttons (true/false)
ShowPowerButtons=true

## Time and date format
## Use Qt date/time format strings
## Examples: "hh:mm", "h:mm AP", "dddd, MMMM d"
TimeFormat="h:mm AP"
DateFormat="dddd, MMMM d"

## Translations - customize any text shown
TranslateLogin="Login"
TranslateLoginFailed="Login Failed"
TranslateUsername="Username"
TranslatePassword="Password"
TranslateSession="Session"
TranslateSuspend="Suspend"
TranslateReboot="Reboot"
TranslateShutdown="Shutdown"
