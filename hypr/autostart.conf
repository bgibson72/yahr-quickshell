#################
### AUTOSTART ###
#################

# Optimized staggered startup for better performance
# Phase 1: Critical components (immediate)
exec-once = quickshell
exec-once = hyprpolkitagent

# Phase 2: Essential services (250ms delay)
exec-once = sleep 0.25 && swww-daemon
exec-once = sleep 0.25 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Phase 2.5: Restore wallpaper (after swww-daemon is ready)
# Fallback: if no persisted wallpaper exists yet, pick a Catppuccin wallpaper and persist it.
exec-once = sleep 1.5 && bash -c 'wp=$(cat ~/.config/quickshell/last-wallpaper 2>/dev/null); if [ -n "$wp" ] && [ -f "$wp" ]; then swww img "$wp"; else dir="$HOME/Pictures/Wallpapers/Catppuccin"; if [ -d "$dir" ]; then wp=$(find "$dir" -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | shuf -n 1); [ -n "$wp" ] && swww img "$wp" && printf "%s" "$wp" > "$HOME/.config/quickshell/last-wallpaper"; fi; fi'

# Phase 3: User-facing services (500ms delay)
exec-once = sleep 0.5 && mako
exec-once = sleep 0.5 && hypridle

# Phase 4: Background services (1s delay)
exec-once = sleep 1 && wl-paste --watch cliphist store
exec-once = sleep 1 && ~/.config/quickshell/monitor-change-handler.sh
